<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- "h" centered -->
  <text x="256" y="320" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-size="240" font-weight="300" fill="#f8fafc" letter-spacing="-12">h</text>

  <!-- PRO badge -->
  <rect x="300" y="210" width="80" height="30" rx="15" fill="#f8fafc"/>
  <text x="340" y="232" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#0f172a" letter-spacing="2.5">PRO</text>
</svg>
