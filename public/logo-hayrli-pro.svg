<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Scissors icon (abstract) -->
  <g transform="translate(256, 170)" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-28" cy="-24" r="18"/>
    <circle cx="28" cy="-24" r="18"/>
    <line x1="-16" y1="-10" x2="16" y2="-10"/>
    <line x1="-10" y1="-10" x2="0" y2="12"/>
    <line x1="10" y1="-10" x2="0" y2="12"/>
  </g>

  <!-- "h" lettermark -->
  <text x="256" y="310" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-size="160" font-weight="300" fill="#f8fafc" letter-spacing="-8">h</text>

  <!-- "PRO" badge -->
  <rect x="296" y="240" width="72" height="28" rx="14" fill="#f8fafc"/>
  <text x="332" y="260" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-size="14" font-weight="600" fill="#0f172a" letter-spacing="2">PRO</text>

  <!-- "hayrli" wordmark below -->
  <text x="256" y="400" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-size="52" font-weight="300" fill="#f8fafc" letter-spacing="-1">hayrli</text>
  <text x="256" y="435" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-size="18" font-weight="500" fill="#64748b" letter-spacing="6">FOR PROFESSIONALS</text>
</svg>
